<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support FontFixer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 820px;
      width: 100%;
      overflow: hidden;
    }

    /* ── Header banner ── */
    .banner {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 36px 40px 32px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .banner-icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      backdrop-filter: blur(4px);
    }
    .banner-text h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .banner-text p {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.5;
    }

    /* ── Body two-column ── */
    .body {
      display: flex;
      gap: 0;
    }

    .col {
      flex: 1;
      padding: 28px 36px;
    }
    .col-left {
      border-right: 1px solid #eee;
    }

    .col h2 {
      font-size: 15px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 14px;
    }

    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feature-list li {
      font-size: 14px;
      line-height: 1.6;
      color: #444;
      padding-left: 22px;
      position: relative;
    }
    .feature-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #667eea;
      opacity: 0.5;
    }

    .thank-text {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
    }
    .thank-text p + p {
      margin-top: 12px;
    }
    .thank-text .heart {
      color: #e74c3c;
    }

    /* ── CTA ── */
    .cta {
      text-align: center;
      padding: 28px 36px 36px;
      border-top: 1px solid #eee;
    }
    .cta .disclaimer {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 12px;
      font-style: italic;
    }
    .cta p {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .kofi-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      background: #72a4f2;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(114, 164, 242, 0.35);
    }
    .kofi-btn:hover {
      background: #5b8ee0;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(114, 164, 242, 0.4);
    }
    .kofi-btn:active {
      transform: translateY(0);
    }
    .kofi-btn .btn-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 16px 36px 20px;
      font-size: 12px;
      color: #aaa;
    }
    .footer a {
      color: #667eea;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      body { padding: 12px; }
      .banner { padding: 24px 20px; flex-direction: column; text-align: center; }
      .body { flex-direction: column; }
      .col-left { border-right: none; border-bottom: 1px solid #eee; }
      .col { padding: 24px 20px; }
      .cta { padding: 24px 20px 28px; }
    }
  </style>
</head>

          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>

    // ============================================================
    //  Language detection
    // ============================================================
    function detectLang() {
      const raw = (navigator.language || 'en').toLowerCase();
      const map = { 'zh-tw': 'zh', 'zh-hans': 'zh', 'zh-hant': 'zh', 'zh-cn': 'zh' };
      const mapped = map[raw] || raw;
      const base = mapped.split('-')[0];
      return I18N[mapped] ? mapped : (I18N[base] ? base : 'en');
    }

    // ============================================================
    //  Apply translations to DOM
    // ============================================================
    function applyLang(lang) {
      const t = I18N[lang];

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.getElementById('featureList').innerHTML = t.features.map(f => `<li>${f}</li>`).join('');
      document.getElementById('thankText').innerHTML = t.thank.map(p => `<p>${p}</p>`).join('');
      document.documentElement.lang = lang;
    }

    // ============================================================
    //  Init
    // ============================================================
    applyLang(detectLang());
